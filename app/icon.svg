  <title id="title">Outsource Accounts Payable logo</title>
  <desc id="desc">A custom invoice approvals and AP controls mark with a AP wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b210c"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b210c" flood-opacity="0.24"/>
